site_name: AgentFlow
site_description: The async-first, graph-based SDK for building agent workflows.
site_author: Daniel Sorkin
copyright: Copyright &copy; 2026 Daniel Sorkin — Apache-2.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

repo_name: agent-workflow-sdk
repo_url: https://github.com/dankosorkin/agent-workflow-sdk

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            # link to other members in signatures
            signature_crossrefs: true
            # source order reads better than alphabetical for this codebase
            members_order: source
            # signature on its own line, with type annotations
            separate_signature: true
            show_signature_annotations: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  generator: false

nav:
  - Home: index.md
  - Get started:
      - Overview: get-started/overview.md
      - Installation: get-started/installation.md
      - Quickstart: get-started/quickstart.md
      - Mental model: get-started/mental-model.md
  - Core concepts:
      - State and reducers: concepts/state.md
      - Nodes and edges: concepts/nodes-and-edges.md
      - The execution model: concepts/execution.md
      - The Context object: concepts/context.md
      - Running a graph: concepts/running.md
      - Subgraphs: concepts/subgraphs.md
  - Backends:
      - Overview: backends/overview.md
      - Agent backends: backends/agent-backends.md
      - LLM backends: backends/llm-backends.md
      - Permissions: backends/permissions.md
      - Retries and rate limits: backends/retries.md
  - Durability and operations:
      - Checkpointing: durability/checkpointing.md
      - Human-in-the-loop: durability/human-in-the-loop.md
      - Quality gates: durability/quality-gates.md
      - Cross-thread memory (Store): durability/store.md
      - Control plane: durability/control-plane.md
      - Observability: durability/observability.md
  - Patterns:
      - Prebuilt patterns: patterns/prebuilt.md
      - Long-running loops: patterns/long-running-loops.md
      - "Tutorial: a documentation Q&A agent": patterns/tutorial-qa-agent.md
  - Reference:
      - API cheatsheet: reference/api.md
      - Glossary: reference/glossary.md
      - API Reference:
          - State and reducers: reference/api/state.md
          - Graph: reference/api/graph.md
          - Compiled graph: reference/api/compiled.md
          - Runtime and context: reference/api/runtime.md
          - Events: reference/api/events.md
          - Backends: reference/api/backends.md
          - Permissions: reference/api/permissions.md
          - Checkpointing: reference/api/checkpoint.md
          - Store: reference/api/store.md
          - Control plane: reference/api/controlplane.md
          - Observability: reference/api/observability.md
          - Prebuilt patterns: reference/api/prebuilt.md
          - Quality gates: reference/api/gate.md
          - Watch: reference/api/watch.md
          - Interrupt payloads: reference/api/interrupts.md
          - Errors: reference/api/errors.md
