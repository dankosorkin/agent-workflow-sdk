[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-workflow-sdk"
version = "0.1.0"
description = "Async-first, LangGraph-style SDK for building agent workflows with pluggable agent and LLM backends."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Sorkin" }]
keywords = ["agents", "workflow", "graph", "llm", "orchestration", "async"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Typing :: Typed",
]

# Core is dependency-free (stdlib only). Backends that need extra libraries
# are optional extras.
dependencies = []

[project.optional-dependencies]
ollama = ["httpx>=0.27"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
redis = ["redis>=5"]
postgres = ["asyncpg>=0.29"]
prometheus = ["prometheus-client>=0.20"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "fakeredis>=2.20",
    "prometheus-client>=0.20",
]

[project.urls]
Homepage = "https://github.com/dankosorkin/agent-workflow-sdk"
Repository = "https://github.com/dankosorkin/agent-workflow-sdk"
Changelog = "https://github.com/dankosorkin/agent-workflow-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/dankosorkin/agent-workflow-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Live tests spawn real agent CLIs / hit a real Ollama server. They are opt-in:
# the default run skips them so CI stays hermetic. Run them with `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: end-to-end test against a real backend (agent CLI or Ollama server); opt-in, skipped by default",
]

# Coverage is opt-in to keep the default `pytest` fast. Run:
#   pytest --cov
[tool.coverage.run]
source = ["agentflow"]
branch = true
omit = [
    "tests/*",
    "examples/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",  # Protocol / stub method bodies
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agentflow", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# B008: httpx/asyncio defaults; SIM105: explicit try/except is clearer in spots.
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]        # long scripted fixtures / event dicts
"examples/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["agentflow"]
ignore_missing_imports = true    # httpx is an optional extra
warn_unused_ignores = false
check_untyped_defs = true
# Pragmatic: the codebase uses dynamic dicts as state; full strictness later.
disallow_untyped_defs = false
warn_redundant_casts = true
no_implicit_optional = true
