[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-workflow-sdk"
version = "0.1.0"
description = "Async-first, LangGraph-style SDK for building agent workflows with pluggable agent and LLM backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentFlow" }]
keywords = ["agents", "workflow", "graph", "llm", "orchestration", "async"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
]

# Core is dependency-free (stdlib only). Backends that need extra libraries
# are optional extras.
dependencies = []

[project.optional-dependencies]
ollama = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.urls]
Homepage = "https://example.com/agentic-workflow-sdk"

[tool.hatch.build.targets.wheel]
packages = ["agentflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Live tests spawn real agent CLIs / hit a real Ollama server. They are opt-in:
# the default run skips them so CI stays hermetic. Run them with `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: end-to-end test against a real backend (agent CLI or Ollama server); opt-in, skipped by default",
]

# Coverage is opt-in to keep the default `pytest` fast. Run:
#   pytest --cov
[tool.coverage.run]
source = ["agentflow"]
branch = true
omit = [
    "tests/*",
    "examples/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",  # Protocol / stub method bodies
]
