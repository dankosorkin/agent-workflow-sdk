[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-workflow-sdk"
version = "0.1.0"
description = "Async-first, LangGraph-style SDK for building agent workflows with pluggable agent and LLM backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentFlow" }]
keywords = ["agents", "workflow", "graph", "llm", "orchestration", "async"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
]

# Core is dependency-free (stdlib only). Backends that need extra libraries
# are optional extras.
dependencies = []

[project.optional-dependencies]
ollama = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://example.com/agentic-workflow-sdk"

[tool.hatch.build.targets.wheel]
packages = ["agentflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
