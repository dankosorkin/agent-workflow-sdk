name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[ollama,dev]'
      - name: Ruff (lint + format check)
        run: |
          ruff check agentflow tests examples
          ruff format --check agentflow tests examples
      - name: mypy (type check)
        run: mypy agentflow
      - name: pip-audit (dependency CVE scan)
        run: pip-audit || true   # advisory; do not fail the build on transient DB issues

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev + ollama extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[ollama,dev]'

      - name: Run offline test suite with coverage
        # The default addopts (-m 'not live') skips backend smoke tests, so CI
        # stays hermetic — no agent CLIs or network required.
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the built wheel ships py.typed
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "agentflow/py.typed" in names, "py.typed missing from wheel"
          print("py.typed present in", wheel)
          PY
