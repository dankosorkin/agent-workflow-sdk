name: Release

# Publish to PyPI and cut a GitHub Release when a version tag is pushed.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the tag matches the packaged version
        # A tag of vX.Y.Z must match pyproject's version and __version__, so a
        # mistagged release fails here instead of publishing the wrong build.
        run: |
          python -m pip install --upgrade pip
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          pkg=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('agentflow/__init__.py').read()).group(1))")
          echo "tag=$tag pyproject=$proj package=$pkg"
          test "$tag" = "$proj" || { echo "tag != pyproject version"; exit 1; }
          test "$tag" = "$pkg"  || { echo "tag != __version__"; exit 1; }

      - name: Build wheel + sdist
        run: |
          python -m pip install build
          python -m build

      - name: Check artifacts (twine + py.typed)
        run: |
          python -m pip install twine
          python -m twine check dist/*
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          assert "agentflow/py.typed" in zipfile.ZipFile(wheel).namelist(), "py.typed missing"
          print("py.typed present in", wheel)
          PY

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): no API token stored anywhere. Configure the
    # matching publisher for this repo/workflow on PyPI once (Project settings
    # -> Publishing) and every tagged build publishes with no secret.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Fetch built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for what changed."
